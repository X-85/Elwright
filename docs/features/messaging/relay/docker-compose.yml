services:
  relay:
    build: .
    image: elwright-relay:local
    container_name: elwright-relay
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      BIND_ADDR: "0.0.0.0:9000"
      RUST_LOG: "info"
    # 生产建议挂载独立 volume 收集日志
    # volumes:
    #   - ./logs:/var/log/relay