name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查（2026-08-23 工程质量治理第一档）：clippy 零警告 + rustfmt 格式。
  # 只跑一次（ubuntu），比三平台矩阵快——三平台行为差异由下方 rust job 兜。
  lint:
    name: Rust lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: rustfmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      # Linux 需 webkit2gtk 系统库才能通过 clippy --all-targets（编译 tauri 壳）
      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: clippy --all-targets
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 产品目标平台：Windows（优先）+ macOS；ubuntu 顺带兜底 unix 通用问题
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri 2 在 Linux 上链接 webkit2gtk 系统库；runner 默认未装（3b 起
      # cargo test 会连带编译 tauri 壳，缺库则构建失败 exit 101）
      - name: Install Tauri system deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 失败时把测试结果摘要写入 step summary（check-runs API 可无鉴权读取，
      # 本机无 gh/token 拉不了 job 日志——CI 排障用，修复后可撤）
      - name: cargo test
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          if cargo test 2>&1 | tee /tmp/ct.log; then
            echo "cargo test 全绿"
          else
            # ::error:: workflow command 会变成 check-run annotation（无鉴权可读）
            tail -10 /tmp/ct.log | while IFS= read -r line; do
              echo "::error::T|${line:0:300}"
            done
            {
              echo "### cargo test 失败详情"
              echo '```'
              tail -120 /tmp/ct.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: cargo build (CLI ew)
        working-directory: src-tauri
        run: cargo build --bin ew

      # EW 必须定义在 step 级 env：runner 上下文在 job 级 env 不可用（首跑因此启动失败）
      - name: Smoke - ew ls（注册表可加载）
        shell: bash
        env:
          EW: ${{ format('src-tauri/target/debug/ew{0}', runner.os == 'Windows' && '.exe' || '') }}
        run: |
          "$EW" ls | grep -q "text-stats"
          "$EW" ls | tail -n 1 | grep -q "项能力"

      - name: Smoke - 降级 SOP 可读
        shell: bash
        env:
          EW: ${{ format('src-tauri/target/debug/ew{0}', runner.os == 'Windows' && '.exe' || '') }}
        run: '"$EW" invoke weekly-report | grep -q "周报生成 · 离线 SOP"'

      # 阶段 2 手工验证的 mock OpenAI 兼容端点，回归 invoke 成功路径
      - name: Smoke - mock LLM invoke 成功路径
        if: runner.os != 'Windows'
        shell: bash
        env:
          EW: ${{ format('src-tauri/target/debug/ew{0}', runner.os == 'Windows' && '.exe' || '') }}
        run: |
          cat > "$RUNNER_TEMP/mock_llm.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != "/v1/chat/completions":
                      self.send_response(404)
                      self.end_headers()
                      return
                  body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  sys_msg = body["messages"][0]["content"]
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  resp = {"choices": [{"message": {"role": "assistant",
                      "content": f"[模拟LLM回复] system={sys_msg!r} user={body['messages'][1]['content']!r} model={body['model']}"}}]}
                  self.wfile.write(json.dumps(resp).encode())

              def log_message(self, *a):
                  pass

          HTTPServer(("127.0.0.1", 18434), H).serve_forever()
          PY
          python3 "$RUNNER_TEMP/mock_llm.py" &
          MOCK_PID=$!
          sleep 1
          export ELWRIGHT_LLM_BASE_URL=http://127.0.0.1:18434/v1
          export ELWRIGHT_LLM_MODEL=mock-model
          "$EW" invoke weekly-report CI | grep -q "模拟LLM回复"
          kill $MOCK_PID

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: npm ci
        working-directory: src
        run: npm ci

      # 纯逻辑模块单测（safeMarkdown 安全底线 / theme 三态 / 版本比较）
      - name: npm test
        working-directory: src
        run: npm test

      # 浏览器级 e2e（chromium）：browserBridge ↔ dev 插件接缝 + 预览模式降级守卫。
      # 桌面壳 IPC 层由 rust matrix job 的 tests/terminal_ipc.rs 覆盖。
      - name: Playwright e2e
        working-directory: src
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: npm run build
        working-directory: src
        run: npm run build

  # 阶段 4 起产出安装包制品，push 到 main 时上传。
  # Windows msi 用 runner 自带 MSVC 打包（enhancement-2026-08-windows-msi-ci，
  # 替代 stage4-release/design.md §3 原定的公司机装 MSVC 方案）。
  dmg:
    name: macOS dmg artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: npm ci (frontend deps incl. tauri-cli)
        working-directory: src
        run: npm ci

      # dmg 的 AppleScript 美化偶发 Finder 超时（-1712），重试即过（本地已验证）
      - name: tauri build (dmg)
        working-directory: src-tauri
        run: ../src/node_modules/.bin/tauri build --bundles dmg || ../src/node_modules/.bin/tauri build --bundles dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Elwright-macos-aarch64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # runner 自带 VS/MSVC（Rust 矩阵在 windows-latest 编译通过即为证明），
  # WiX 由 tauri-cli 自动下载。公司机因此无需装 MSVC 即可分发给用户 msi。
  msi:
    name: Windows msi artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: npm ci (frontend deps incl. tauri-cli)
        working-directory: src
        run: npm ci

      # 诊断辅助（enhancement-2026-08-windows-msi-ci 首跑失败）：
      # 1) release 编译独立成步，用步骤结论区分「编译失败」vs「打包失败」
      - name: cargo build --release
        working-directory: src-tauri
        run: cargo build --release

      # 2) 失败时把日志尾部转成 error annotation——仓库日志 API 需权限，
      #    而 check-run annotations 公开可读（本地无 gh/token 时的诊断通道）
      # shell: bash 让相对路径 ../src/node_modules/.bin/tauri 走 .bin 下的 sh
      # shim——Windows 默认 pwsh 按相对路径找不到无扩展名可执行文件
      - name: tauri build (msi)
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          ../src/node_modules/.bin/tauri build --bundles msi > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "tauri build 失败，退出码 $rc；build.log 尾部："
            tail -n 5 build.log
            tail -n 50 build.log | sed 's/\r$//' | grep -v '^$' | while IFS= read -r l; do echo "::error::$l"; done
            exit $rc
          fi

      - name: Upload msi
        uses: actions/upload-artifact@v4
        with:
          name: Elwright-windows-x64
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
