<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Elwright 应用图标 v5：黑底白 Σ 负空间（学 ZCode 手法）
       上横线 + Σ 双斜折 + 下横线；两斜块反向倾斜，折点汇聚于右侧
       左对齐；上下缝约 3-4% 画面；横线带圆角，斜块直角（折角处自然收口） -->
  <rect width="1024" height="1024" fill="#0d0d0d"/>
  <g fill="#f5f5f5">
    <!-- 上横线（水平直线，圆角） -->
    <rect x="264" y="296" width="496" height="72" rx="16"/>
    <!-- 上斜块：左对齐 x=264，左高右低，垂直厚 72 -->
    <path d="M264 408 H760 V521 L264 480 Z"/>
    <!-- 下斜块：左对齐 x=264，反向（左低右高），垂直厚 72 -->
    <path d="M264 544 H760 V581 L264 616 Z"/>
    <!-- 下横线（水平直线，圆角） -->
    <rect x="264" y="656" width="496" height="72" rx="16"/>
  </g>
</svg>