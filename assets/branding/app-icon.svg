<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Elwright 应用图标 v9b：黑底白 Z 负空间（学 ZCode 手法）
       按原图比例 + 严格左对齐：上横线、下横线、上下斜块左端都对齐到 x=264
       下横线比上横线长（向右伸出）；块细（40 vs 72）；下块下移
       横线圆角 rx=16，斜块直角 -->
  <rect width="1024" height="1024" fill="#0d0d0d"/>
  <g fill="#f5f5f5">
    <!-- 上横线（短，圆角） -->
    <rect x="264" y="296" width="496" height="72" rx="16"/>
    <!-- 上斜块：左对齐 x=264，左高右低，垂直厚 40，水平宽 220，斜率 0.127 -->
    <path d="M264 416 L484 444 V484 L264 456 Z"/>
    <!-- 下斜块：左对齐 x=264，反向（左低右高），垂直厚 40，整体下移 80 -->
    <path d="M264 568 L484 540 V580 L264 608 Z"/>
    <!-- 下横线（长，圆角，左端 x=264 严格对齐，右端 x=844 比上横线伸出 84） -->
    <rect x="264" y="664" width="580" height="64" rx="14"/>
  </g>
</svg>