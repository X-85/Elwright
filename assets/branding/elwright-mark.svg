<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Elwright 标识 · v9b：黑底白 Z（学 ZCode 负空间手法）
       上横线（短）+ Z 双斜折（块细）+ 下横线（长，向右伸出 84）
       两块反向（右上-左下 / 左上-右下），折点中央偏右
       严格左对齐（所有元素左端 x=264）；块厚 40、横线粗 64-72；横线圆角 rx=14-16，斜块直角 -->
  <rect width="1024" height="1024" fill="#0d0d0d"/>
  <g fill="#f5f5f5">
    <rect x="264" y="296" width="496" height="72" rx="16"/>
    <path d="M264 416 L484 444 V484 L264 456 Z"/>
    <path d="M264 568 L484 540 V580 L264 608 Z"/>
    <rect x="264" y="664" width="580" height="64" rx="14"/>
  </g>
</svg>